<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto Power AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#26365d,#070b14 70%);color:#fff}
header{text-align:center;padding:25px 15px 15px}
h1{margin:0;font-size:clamp(32px,6vw,56px);letter-spacing:2px}
.subtitle{color:#c8d4e8;margin:8px 0}
.container{width:min(1100px,94%);margin:auto}
.demo{background:#0c1220e8;border:1px solid #ffffff1c;border-radius:20px;padding:16px}
.camera{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#webcam,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#webcam{transform:scaleX(-1)}
#overlay{pointer-events:none}
.controls{text-align:center;padding:16px 5px}
button{border:0;border-radius:999px;padding:13px 28px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#status{color:#c8d4e8;min-height:20px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}
.card{background:#ffffff0d;border:1px solid #ffffff12;border-radius:14px;padding:16px}
.card h2{margin:0 0 7px;font-size:19px}.card p{margin:0;color:#c8d4e8}
footer{text-align:center;color:#91a0b8;padding:22px;font-size:13px}
@media(max-width:700px){.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>⚡ Naruto Power AI ⚡</h1>
<p class="subtitle">AI hand gesture detection with real-time Naruto & Sasuke effects</p>
</header>

<main class="container">
<section class="demo">
<div class="camera">
<video id="webcam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
</div>
<div class="controls">
<button id="startBtn">Start Camera</button>
<p id="status">Click Start Camera</p>
</div>
</section>

<section class="info">
<div class="card"><h2>🔥 Left Hand → Naruto</h2><p>Open your left hand to activate Naruto.</p></div>
<div class="card"><h2>⚡ Right Hand → Sasuke</h2><p>Open your right hand to activate Sasuke.</p></div>
</section>
</main>

<video id="narutoVideo" src="./naruto.mp4" muted playsinline loop preload="auto" style="display:none"></video>
<video id="sasukeVideo" src="./sasuke.mp4" muted playsinline loop preload="auto" style="display:none"></video>

<footer>Naruto Power AI • Computer Vision + MediaPipe</footer>

<script type="module">
import { HandLandmarker, FilesetResolver }
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video=document.getElementById("webcam");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const btn=document.getElementById("startBtn");
const status=document.getElementById("status");
const naruto=document.getElementById("narutoVideo");
const sasuke=document.getElementById("sasukeVideo");

let detector=null, stream=null, running=false, lastTime=-1;

const links=[
[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
[13,17],[17,18],[18,19],[19,20],[0,17]
];

function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function openHand(p){
let n=0;
for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]])
 if(d(p[tip],p[0])>d(p[pip],p[0])) n++;
return n>=3;
}

function sizeCanvas(){
if(video.videoWidth && video.videoHeight){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
}
}

function drawHand(p,label){
ctx.strokeStyle="#00e5ff";ctx.lineWidth=3;
for(const [a,b] of links){
ctx.beginPath();
ctx.moveTo(p[a].x*canvas.width,p[a].y*canvas.height);
ctx.lineTo(p[b].x*canvas.width,p[b].y*canvas.height);
ctx.stroke();
}
ctx.fillStyle="#fff";
for(const q of p){
ctx.beginPath();ctx.arc(q.x*canvas.width,q.y*canvas.height,4,0,Math.PI*2);ctx.fill();
}
const w=p[0];
ctx.font="bold 18px Arial";
ctx.fillText(label,w.x*canvas.width+12,w.y*canvas.height-12);
}

function effect(v,x,y,w,h,opacity){
if(v.readyState<2)return;
const aspect=(v.videoWidth/v.videoHeight)||1.4;
if(aspect>w/h)h=w/aspect;else w=h*aspect;
ctx.save();
ctx.globalAlpha=opacity;
ctx.globalCompositeOperation="screen";
ctx.drawImage(v,x-w/2,y-h/2,w,h);
ctx.restore();
}

async function loadAI(){
status.textContent="Camera is on. Loading AI hand tracking...";
try{
const vision=await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
);
detector=await HandLandmarker.createFromOptions(vision,{
baseOptions:{modelAssetPath:"./hand_landmarker.task",delegate:"GPU"},
runningMode:"VIDEO",numHands:2,
minHandDetectionConfidence:.65,
minHandPresenceConfidence:.65,
minTrackingConfidence:.65
});
status.textContent="AI ready — show an open hand!";
requestAnimationFrame(loop);
}catch(e){
console.error(e);
status.textContent="Camera works, but AI failed to load. Check the browser console.";
}
}

async function start(){
try{
btn.disabled=true;
status.textContent="Requesting camera permission...";

stream=await navigator.mediaDevices.getUserMedia({
video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},
audio:false
});
video.srcObject=stream;

await new Promise(resolve=>{
if(video.readyState>=1) resolve();
else video.onloadedmetadata=resolve;
});
await video.play();
sizeCanvas();

btn.textContent="Camera Running";
status.textContent="Camera is on — loading AI...";
running=true;
loadAI();
}catch(e){
console.error(e);
status.textContent="Camera error: "+(e.message||e.name);
btn.disabled=false;
btn.textContent="Start Camera";
}
}

async function loop(){
if(!running)return;
if(video.readyState>=2){
sizeCanvas();
ctx.clearRect(0,0,canvas.width,canvas.height);

if(detector && video.currentTime!==lastTime){
lastTime=video.currentTime;
try{
const result=detector.detectForVideo(video,performance.now());
let left=false,right=false;

for(let i=0;i<result.landmarks.length;i++){
const p=result.landmarks[i];
const raw=result.handednesses[i][0].categoryName;
const visualRight=raw==="Left";
const opened=openHand(p);
drawHand(p,visualRight?"RIGHT → SASUKE":"LEFT → NARUTO");

const wrist=p[0], palm=p[9];
const x=wrist.x*canvas.width, y=wrist.y*canvas.height;

if(opened && visualRight){
right=true;sasuke.play().catch(()=>{});
effect(sasuke,x,y,600,450,.85);
}
if(opened && !visualRight){
left=true;
naruto.play().catch(()=>{});
const dx=(palm.x-wrist.x)*canvas.width;
const dy=(palm.y-wrist.y)*canvas.height;
effect(naruto,palm.x*canvas.width+dx*.8,palm.y*canvas.height+dy*.8-100,500,350,.85);
}
}
status.textContent=left||right
?(left?"🔥 Naruto active ":"")+(right?"⚡ Sasuke active":"")
:"Camera active — show an open hand";
}catch(e){console.error(e)}
}
}
requestAnimationFrame(loop);
}

btn.addEventListener("click",start);
</script>
</body>
</html>
